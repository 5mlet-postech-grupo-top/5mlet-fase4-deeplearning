version: '3.8'

services:
  app:
    build: ..
    image: lstm-api
    container_name: lstm-api
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports:
      - '8000:8000'
    volumes:
      - ..:/app:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      # use local config for docker-compose (scrapes host.docker.internal:8000 and app:8000)
      - ./prometheus/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'

  grafana:
    build:
      context: ./grafana
    image: grafana-custom:local
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - PROMETHEUS_URL=http://prometheus:9090
    # keep dashboards mount so you can iterate dashboards locally
    volumes:
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
